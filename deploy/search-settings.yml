use_default_settings:
  engines:
    keep_only: [bing, baidu, sogou, wikipedia]
general:
  contact_url: https://agent.qdqc.com
server:
  secret_key: REPLACE_PRIVATE_SECRET
  limiter: false
  image_proxy: false
search:
  safe_search: 1
  formats: [json]
outgoing:
  request_timeout: 8.0
  max_request_timeout: 12.0
  pool_connections: 24
  pool_maxsize: 24
engines:
  - name: bing
    disabled: false
  - name: baidu
    disabled: false
  - name: sogou
    disabled: false
  - name: wikipedia
    disabled: false
  - name: bing
    base_url: https://www.bing.com
