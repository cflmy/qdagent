name: Small-model Marqdo architecture contract
on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_small_model_contract.py' -v

  rust-native-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch matching Marqdo source for the path dependency
        run: git clone --depth 1 --branch v2.9.1 https://github.com/cflmy/marqdo.git ../marqdo
      - name: Compile the real ABI plugin and run the full library test set
        run: cargo test --manifest-path ext/qdagent/native/Cargo.toml --locked --lib

  marqdo-document-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install published Marqdo 2.9.1 CLI
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/cflmy/marqdo/releases/download/v2.9.1/marqdo-2.9.1-x86_64-unknown-linux-gnu.zip \
            --output /tmp/marqdo-2.9.1.zip
          mkdir -p /tmp/marqdo-release
          unzip -q /tmp/marqdo-2.9.1.zip -d /tmp/marqdo-release
          cli="$(find /tmp/marqdo-release -type f -name marqdo | head -n 1)"
          test -n "$cli"
          chmod +x "$cli"
          mkdir -p "$HOME/.local/bin"
          cp "$cli" "$HOME/.local/bin/marqdo"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Parse actual production entry and control documents
        env:
          MARQDO_LIB: ${{ github.workspace }}/lib
          MARQDO_EXT: ${{ github.workspace }}/ext
        run: |
          marqdo check ext/root-skill/index.mq.md --json
          marqdo check ext/root-skill/runtime/memory.mq.md --json
          marqdo check skills/marqdo-dev/native-agent-control.mq.md --json
          marqdo check tests/small-model-memory.mq.md --json
          marqdo run tests/small-model-memory.mq.md --json
          marqdo check docs/knowledge-compilation.mq.md --json
          marqdo check skills/marqdo-dev/knowledge-evidence.mq.md --json
          marqdo check tests/knowledge-proof-policy.mq.md --json
          marqdo run tests/knowledge-proof-policy.mq.md --json
          marqdo check tests/knowledge-projections.mq.md --narrative-ratio --json
          marqdo run tests/knowledge-projections.mq.md --json
          marqdo check tests/knowledge-proof-execution.mq.md --narrative-ratio --json
          marqdo run tests/knowledge-proof-execution.mq.md --json
          marqdo check tests/model-retry-policy.mq.md --narrative-ratio --json
          marqdo run tests/model-retry-policy.mq.md --json
          marqdo check tests/root-dag-scheduling.mq.md --narrative-ratio --json
          marqdo run tests/root-dag-scheduling.mq.md --json
          marqdo check tests/ext/ai-native-flow.mq.md --narrative-ratio --json
          marqdo run tests/ext/ai-native-flow.mq.md --json
          marqdo check tests/ext/ai-native-workflow.mq.md --narrative-ratio --json
          marqdo run tests/ext/ai-native-workflow.mq.md --json
          marqdo check tests/fixtures/proof-modular/math.mq.md --narrative-ratio --json
          marqdo check tests/fixtures/proof-modular/ops.mq.md --narrative-ratio --json
          marqdo check tests/fixtures/proof-modular/main.mq.md --narrative-ratio --json
          marqdo check tests/fixtures/proof-scope/index.mq.md --narrative-ratio --json
          marqdo check tests/fixtures/ambiguous-scope/alpha.mq.md --narrative-ratio --json
          marqdo check tests/fixtures/ambiguous-scope/beta.mq.md --narrative-ratio --json
      - name: Root-flow behaviour tests against the real CLI
        env:
          MARQDO_LIB: ${{ github.workspace }}/lib
          MARQDO_EXT: ${{ github.workspace }}/ext
        run: python3 -m unittest tests.test_root_skill -v
      - name: Context economy measurement stays reproducible
        run: python3 tests/context_economy.py 19655 27320 19200
  knowledge-compilation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install poppler for PDF source extraction
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Install published Marqdo 2.9.1 CLI
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/cflmy/marqdo/releases/download/v2.9.1/marqdo-2.9.1-x86_64-unknown-linux-gnu.zip \
            --output /tmp/marqdo-2.9.1.zip
          mkdir -p /tmp/marqdo-release
          unzip -q /tmp/marqdo-2.9.1.zip -d /tmp/marqdo-release
          cli="$(find /tmp/marqdo-release -type f -name marqdo | head -n 1)"
          test -n "$cli"
          chmod +x "$cli"
          mkdir -p "$HOME/.local/bin"
          cp "$cli" "$HOME/.local/bin/marqdo"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Knowledge compilation keeps real source locations and test isolation
        env:
          MARQDO_LIB: ${{ github.workspace }}/lib
          MARQDO_EXT: ${{ github.workspace }}/ext
        working-directory: tests
        run: python3 -m unittest test_knowledge_compilation -v
