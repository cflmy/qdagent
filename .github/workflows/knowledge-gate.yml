# Knowledge gates — thin /v1 + Marqdo verify when CLI installable.
name: knowledge-gate

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  thin-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Thin /v1 (C2b) check
        run: ./scripts/check-v1-thin.sh

  knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Marqdo CLI + Ext (GitHub Release 2.1.3)
        env:
          MARQDO_MIN: "2.1.3"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" "$HOME/.marqdo"
          TAG="v${MARQDO_MIN}"
          # Official Linux bundle: CLI + lib/ + ext/ (+ native .so under ext/native).
          # Asset name must match marqdo release.yml: marqdo-${VER}-x86_64-unknown-linux-gnu.zip
          ZIP="marqdo-${MARQDO_MIN}-x86_64-unknown-linux-gnu.zip"
          URL="https://github.com/cflmy/marqdo/releases/download/${TAG}/${ZIP}"
          echo "Downloading ${URL}"
          curl -fsSL "$URL" -o /tmp/marqdo-linux.zip
          rm -rf /tmp/marqdo-stage
          mkdir -p /tmp/marqdo-stage
          unzip -q /tmp/marqdo-linux.zip -d /tmp/marqdo-stage
          BIN="$(find /tmp/marqdo-stage -type f -name marqdo | head -1)"
          test -n "$BIN" && test -x "$BIN"
          install -m 755 "$BIN" "$HOME/.local/bin/marqdo"
          # Prefer pack layout next to binary (stage root often has ext/ + lib/).
          STAGE_ROOT="$(dirname "$BIN")"
          if [[ -d "$STAGE_ROOT/ext" ]]; then
            cp -a "$STAGE_ROOT/ext/." "$HOME/.marqdo/ext/"
          else
            echo "ext/ missing from release zip" >&2
            exit 1
          fi
          if [[ -d "$STAGE_ROOT/lib" ]]; then
            mkdir -p "$HOME/.marqdo/lib"
            cp -a "$STAGE_ROOT/lib/." "$HOME/.marqdo/lib/"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "MARQDO_EXT=$HOME/.marqdo/ext" >> "$GITHUB_ENV"
          echo "MARQDO_LIB=$HOME/.marqdo/lib" >> "$GITHUB_ENV"
          if [[ -f "$HOME/.marqdo/ext/native/libagent.so" ]]; then
            echo "MARQDO_AGENT_PLUGIN=$HOME/.marqdo/ext/native/libagent.so" >> "$GITHUB_ENV"
          fi
          command -v marqdo
          marqdo --version
          echo "REQUIRE_MARQDO=1" >> "$GITHUB_ENV"
          cat "$HOME/.marqdo/ext/VERSION"
      - name: Knowledge compile + verify
        env:
          REQUIRE_MARQDO: ${{ env.REQUIRE_MARQDO }}
        run: ./scripts/ci-knowledge-gate.sh
