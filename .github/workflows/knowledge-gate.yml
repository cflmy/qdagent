# Knowledge gates — thin /v1 + Marqdo verify when CLI installable.
name: knowledge-gate

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  thin-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Thin /v1 (C2b) check
        run: ./scripts/check-v1-thin.sh

  knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Marqdo CLI (GitHub Release)
        env:
          MARQDO_MIN: "2.1.2"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          # Prefer tagged release asset; fall back to cargo if unavailable.
          TAG="v${MARQDO_MIN}"
          URL="https://github.com/cflmy/marqdo/releases/download/${TAG}/marqdo-x86_64-unknown-linux-gnu.tar.gz"
          if curl -fsSL "$URL" -o /tmp/marqdo.tgz; then
            tar -xzf /tmp/marqdo.tgz -C /tmp
            install -m 755 /tmp/marqdo "$HOME/.local/bin/marqdo" || \
              find /tmp -type f -name marqdo -exec install -m 755 {} "$HOME/.local/bin/marqdo" \;
          else
            echo "Release asset missing — trying cargo install from source sibling skip"
            if command -v cargo >/dev/null 2>&1; then
              cargo install --git https://github.com/cflmy/marqdo --tag "$TAG" marqdo || true
            fi
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # cargo installs the binary to ~/.cargo/bin (release asset went to
          # ~/.local/bin). Add both so subsequent steps find marqdo on PATH
          # regardless of the runner's default PATH layout.
          [[ -d "$HOME/.cargo/bin" ]] && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH" || true
          if command -v marqdo >/dev/null 2>&1; then
            marqdo --version
            echo "REQUIRE_MARQDO=1" >> "$GITHUB_ENV"
          else
            echo "Marqdo CLI not installed; knowledge job will soft-skip"
            echo "REQUIRE_MARQDO=0" >> "$GITHUB_ENV"
          fi
      - name: Ext pack (from cargo checkout, fallback VERSION gate)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.marqdo/ext"
          # `marqdo check` resolves ext/ imports (ext/web, ext/data, ...) that
          # qdagent core files (serve, lib/*, docgate) depend on. `cargo install
          # --git` cloned the marqdo repo incl. ext/ — copy the full pack so the
          # contract gate can run. Fall back to a VERSION-only gate if the
          # checkout isn't found (check then skips ext-dependent files).
          EXT_SRC="$(find "$HOME/.cargo/git/checkouts" -maxdepth 4 -type d -name ext -path "*marqdo*" 2>/dev/null | head -1 || true)"
          if [[ -n "$EXT_SRC" && -d "$EXT_SRC" ]]; then
            cp -a "$EXT_SRC/." "$HOME/.marqdo/ext/"
            echo "ext pack copied from cargo checkout: $EXT_SRC"
          else
            echo "2.1.2" > "$HOME/.marqdo/ext/VERSION"
            echo "cargo checkout not found; VERSION-only gate (marqdo check skips ext-dependent files)"
          fi
          echo "MARQDO_EXT=$HOME/.marqdo/ext" >> "$GITHUB_ENV"
      - name: Native agent plugin (docgate CoW sandbox)
        run: |
          set -uo pipefail
          # docgate selftest exercises ext/ai/sandbox CoW trial, which loads the
          # native agent plugin (libagent.so). `cargo install marqdo` builds only
          # the CLI binary; build the plugin from the cloned checkout so the
          # selftest runs for real. If unavailable, ci-knowledge-gate.sh skips it.
          ROOT_TOML=""
          while IFS= read -r f; do
            d="$(dirname "$f")"
            if [[ -f "$d/plugins/agent/Cargo.toml" ]]; then ROOT_TOML="$f"; break; fi
          done < <(find "$HOME/.cargo/git/checkouts" -maxdepth 3 -name Cargo.toml -path "*marqdo*" 2>/dev/null)
          if [[ -z "$ROOT_TOML" ]]; then
            echo "no cargo checkout found; docgate selftest will be skipped"
            exit 0
          fi
          CHECKOUT="$(dirname "$ROOT_TOML")"
          if cargo build --release -p marqdo_plugin_agent --manifest-path "$ROOT_TOML"; then
            SO="$CHECKOUT/target/release/libagent.so"
            if [[ -f "$SO" ]]; then
              echo "MARQDO_AGENT_PLUGIN=$SO" >> "$GITHUB_ENV"
              echo "agent plugin built: $SO"
            else
              echo "libagent.so not found at $SO after build; docgate selftest will be skipped"
            fi
          else
            echo "agent plugin build failed; docgate selftest will be skipped"
          fi
      - name: Knowledge compile + verify
        env:
          REQUIRE_MARQDO: ${{ env.REQUIRE_MARQDO }}
        run: ./scripts/ci-knowledge-gate.sh
