name: qdagent
services:
  qdagent:
    image: qdagent:local
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "7964:7964"
    user: "10001:10001"
    group_add: ["10003"]
    depends_on:
      browser-sandbox:
        condition: service_healthy
      search:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    stop_grace_period: 20s
    environment:
      QDAGENT_BROWSER_URL: http://browser-sandbox:7318
      QDAGENT_BROWSER_KEY_FILE: /run/browser_token
      QDAGENT_OCR_TOKEN_FILE: /run/paddleocr_token
      QDAGENT_DEFAULT_MODEL: ${QDAGENT_DEFAULT_MODEL:-builtin-local}
      QDAGENT_OIDC_REDIRECT_ORIGINS: ${QDAGENT_OIDC_REDIRECT_ORIGINS:-https://agent.qdqc.com,http://127.0.0.1:7964,http://localhost:7964}
      QDAGENT_OIDC_CLIENT_ID: ${QDAGENT_OIDC_CLIENT_ID:-app_e18ec1c40109417bb34b56c0c1749fe8}
      QDAGENT_OIDC_SECRET_FILE: .secrets/oidc_client_secret
      QDAGENT_MODEL_KEY_FILE: /app/.secrets/model_key
      QDAGENT_OLLAMA_URL: ${QDAGENT_OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - qdagent-data:/app/data
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777,size=256m
      - /app/pages/data:uid=10001,gid=10001,mode=0700,size=16m
    secrets:
      - source: paddleocr_token
        target: /run/paddleocr_token
      - source: browser_token
        target: /run/browser_token
      - source: oidc_client_secret
        target: /app/.secrets/oidc_client_secret
      - source: model_key
        target: /app/.secrets/model_key
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  browser-sandbox:
    image: qdagent-browser:local
    pull_policy: never
    build:
      context: .
      dockerfile: browser-sandbox/Dockerfile
    init: true
    restart: unless-stopped
    user: "10002:10002"
    group_add: ["10003"]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=browser-sandbox/seccomp_profile.json
    pids_limit: 384
    mem_limit: 1536m
    shm_size: 256m
    environment:
      BROWSER_KEY_FILE: /run/browser_token
    secrets:
      - source: browser_token
        target: /run/browser_token
    tmpfs:
      - /tmp:uid=10002,gid=10002,mode=1777,size=256m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:7318/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  search:
    image: searxng/searxng@sha256:932f69dca010db9880bddebb2171f05d8e1a25d04a59149ff65409993d680024
    restart: unless-stopped
    init: true
    user: "977:977"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    environment:
      GRANIAN_HOST: 0.0.0.0
      GRANIAN_PORT: "8080"
      FORCE_OWNERSHIP: "false"
    secrets:
      - source: search_settings
        target: /etc/searxng/settings.yml
    tmpfs:
      - /tmp:uid=977,gid=977,mode=1777,size=64m
      - /var/cache/searxng:uid=977,gid=977,mode=0700,size=64m
    healthcheck:
      test: [CMD, /usr/local/searxng/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
secrets:
  paddleocr_token:
    file: .marqdo/secrets/paddleocr_token
  search_settings:
    file: .marqdo/secrets/search_settings.yml
  browser_token:
    file: .marqdo/secrets/browser_token
  oidc_client_secret:
    file: .marqdo/secrets/oidc_client_secret
  model_key:
    file: .marqdo/secrets/model_key
volumes:
  qdagent-data:
