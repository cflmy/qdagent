[package]
name = "qdagent-transport"
version = "0.12.0"
edition = "2021"
publish = false

[lib]
name = "qdagent_transport"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "qdagent-worker"
path = "src/main.rs"

[dependencies]
marqdo-plugin-sdk = { path = "../../../../marqdo/crates/marqdo-plugin-sdk" }
serde_json = "1"
libc = "0.2"
sha2 = "0.10"
marqdo = { path = "../../../../marqdo", default-features = false }
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }
quick-xml = "=0.38.3"
png = "=0.17.16"
